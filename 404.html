<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh">
<div id="msg" style="text-align:center">Memuat...</div>
<script>
(async function(){
  const rawPath = window.location.pathname;
  const slug = rawPath.replace(/^\/+|\/+$/g,'').split('/')[0].toLowerCase();
  
  // kalau akses root atau index.html, tampilkan index.html asli
  if(!slug || slug==='index.html' || slug==='404.html' || slug===''){
    try{
      const res = await fetch('/index.html');
      const html = await res.text();
      document.open(); document.write(html); document.close();
    }catch(e){
      window.location.href = '/index.html';
    }
    return;
  }

  document.getElementById('msg').innerHTML = '<h2>Mencari link /'+slug+'...</h2>';

  try{
    const r = await fetch('/data.json?v='+Date.now());
    if(!r.ok) throw new Error('data.json tidak ada');
    const data = await r.json();
    // gabung dengan localStorage jika ada
    try{
      const local = JSON.parse(localStorage.getItem('appwus_db')||'{}');
      Object.assign(data, local);
    }catch(e){}

    if(data[slug]){
      document.getElementById('msg').innerHTML = '<h2>Mengalihkan...</h2><p>'+data[slug]+'</p>';
      window.location.replace(data[slug]);
    }else{
      document.getElementById('msg').innerHTML = '<h2>Link /'+slug+' tidak ditemukan</h2><p>data.json belum ada slug ini</p><a href="/" style="color:#38bdf8">Kembali ke Home</a><br><br><small>'+JSON.stringify(Object.keys(data))+'</small>';
    }
  }catch(err){
    document.getElementById('msg').innerHTML = '<h2>Error</h2><p>'+err.message+'</p><a href="/" style="color:#38bdf8">Home</a>';
  }
})();
</script>
</body>
</html>
