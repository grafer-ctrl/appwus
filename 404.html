<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>appwus.com</title>
<script>
  // ambil slug, contoh /sepatu-viral -> sepatu-viral
  const path = window.location.pathname.replace(/\//g, '').trim();
  
  // kalau buka root appwus.com, jangan redirect, paksa load index.html
  if (path === '' || path === 'index.html') {
    // kalau ini file index.html tidak ada, arahkan manual
    if (window.location.pathname === '/404.html') {
       window.location.href = '/';
    } else {
       // coba load index.html secara manual
       fetch('/index.html').then(r=>r.text()).then(html=>{
         document.open(); document.write(html); document.close();
       });
    }
  } else {
    // kalau ada slug /sepatu-viral, baru cari di data.json
    fetch('/data.json?v='+Date.now())
      .then(r=>r.json())
      .then(data=>{
        const local = localStorage.getItem('appwus_db');
        if(local) Object.assign(data, JSON.parse(local));
        
        if(data[path]){
          window.location.replace(data[path]);
        } else {
          document.body.innerHTML = '<div style="font-family:sans-serif;text-align:center;margin-top:80px"><h2>Link /'+path+' tidak ditemukan</h2><a href="/">Kembali ke Home</a></div>';
        }
      })
      .catch(()=>{
        document.body.innerHTML = '<h3 style="text-align:center">Gagal load data.json - cek file data.json kamu</h3>';
      });
  }
</script>
</head>
<body style="margin:0"></body>
</html>
